<!DOCTYPE html>
<html>
<head>
<meta charset="ISO-8859-1">
<title>Student Marks</title>
<style>
body {
	font-family: Arial, sans-serif;
	background-color: #f2f2f2;
	display: flex;
	justify-content: center;
	align-items: center;
	height: 100vh;
	margin: 0;
}

form {
	background-color: white;
	padding: 25px;
	border-radius: 8px;
	box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.2);
}

table {
	border-collapse: collapse;
}

td {
	padding: 10px;
}

input[type="text"], input[type="password"] {
	width: 220px;
	padding: 8px;
	border: 1px solid #ccc;
	border-radius: 4px;
}

input[type="submit"] {
	width: 100%;
	padding: 10px;
	background-color: #4CAF50;
	color: white;
	border: none;
	border-radius: 4px;
	cursor: pointer;
	font-size: 15px;
}

input[type="button"]:hover {
	background-color: #45a049;
}
</style>
</head>
<body>
	<form action="serv2" method="post">
		<h2>Student Marks</h2>
		<table border="1">
			<tr>
				<td>Enter PRN:</td>
				<td><input type="text" name="txtPRN"></td>
			</tr>
			<tr>
				<td>Enter Subject1 Marks:</td>
				<td><input type="text" name="txtSub1"></td>
			</tr>
			<tr>
				<td>Enter Subject2 Marks:</td>
				<td><input type="text" name="txtSub2"></td>
			</tr>
			<tr>
				<td>Enter Subject3 Marks:</td>
				<td><input type="text" name="txtSub3"></td>
			</tr>
			<tr>
				<td>Enter Subject4 Marks:</td>
				<td><input type="text" name="txtSub4"></td>
			</tr>
			<tr>
				<td>Enter Subject5 Marks:</td>
				<td><input type="text" name="txtSub5"></td>
			</tr>
			<tr>
				<td colspan="2"><input type="submit" value="Enter"></td>
			</tr>
		</table>
	</form>
</body>
</html>
